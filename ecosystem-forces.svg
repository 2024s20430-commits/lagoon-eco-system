<path d="M1320 545 Q1385 520 1460 545 T1600 543 L1600 815 L1320 815z" fill="url(#sea)"/>
<!-- barrier dune -->
<path d="M1295 560 Q1320 465 1354 435 Q1385 413 1414 446 Q1446 480 1460 551 L1430 571 Q1375 554 1320 586z" fill="url(#sand)" stroke="#bc9a61" stroke-width="3"/>
