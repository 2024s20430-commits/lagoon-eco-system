<path d="M0 650 Q85 628 155 645 Q238 665 315 622 Q350 602 400 595" fill="none" stroke="#4aacc0" stroke-width="25" stroke-linecap="round"/>
<!-- stream white ripples -->
<path d="M56 644q18-12 36 0m60-1q18-12 36 0m70-4q18-12 36 0" fill="none" stroke="#d8ffff" stroke-width="4"/>
<!-- sun and rain cloud -->
<circle cx="220" cy="302" r="43" fill="#f2c96e"/>
<g fill="#fffdf7"><ellipse cx="388" cy="300" rx="48" ry="25"/><ellipse cx="424" cy="285" rx="38" ry="34"/><ellipse cx="461" cy="303" rx="44" ry="22"/></g>
<path d="M385 325l-12 32m43-30-12 32m43-31-12 32" stroke="#3287a1" stroke-width="6" stroke-linecap="round"/>
<text x="115" y="257" class="en">Rainfall</text><text x="115" y="282" class="si">වර්ෂාපතනය</text>
<text x="280" y="380" class="en">Runoff from catchment</text><text x="280" y="406" class="si">ජල පෝෂක ප්‍රදේශයෙන් ගලා එන ජලය</text>
<!-- wind -->
<path d="M735 319q115-38 212 0m-158 42q90-31 161 1" fill="none" stroke="#5b8f88" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
<text x="756" y="260" class="en">Monsoon wind</text><text x="756" y="286" class="si">මෝසම් සුළං</text>
<text x="700" y="430" class="en">Wind-driven waves</text><text x="700" y="456" class="si">සුළඟින් ඇතිවන රළ</text>
<!-- waves -->
<path d="M1460 605q35-28 70 0t70 0m-140 30q35-28 70 0t70 0m-135 30q35-28 70 0t70 0" fill="none" stroke="#ccf3e8" stroke-width="5"/>
<!-- mangrove forest at shore -->
<g stroke="#694f34" stroke-width="9" stroke-linecap="round" fill="none">
 <path d="M545 560v-145m0 105-42 53m42-40 45 49m-45-75-34-39m34 15 38-44"/>
 <path d="M610 555v-125m0 102-38 55m38-53 43 48m-43-80-36-42m36 15 35-39"/>
 <path d="M680 553v-125m0 96-39 53m39-41 39 42m-39-77-35-40m35 13 39-38"/>
</g>
<g fill="#3e8c5a"><ellipse cx="540" cy="400" rx="42" ry="35"/><ellipse cx="498" cy="427" rx="38" ry="28"/><ellipse cx="580" cy="430" rx="42" ry="30"/><ellipse cx="608" cy="398" rx="45" ry="33"/><ellipse cx="658" cy="420" rx="40" ry="28"/><ellipse cx="697" cy="398" rx="42" ry="32"/><ellipse cx="680" cy="442" rx="45" ry="27"/></g>
<text x="500" y="350" class="en">Mangroves</text><text x="500" y="376" class="si">කඩොලාන</text>
<!-- roots -->
<path d="M520 560q-18 24-26 55m50-52q18 22 27 54m27-61q-19 29-21 61m47-65q19 24 28 60m28-56q-18 20-23 57m42-57q17 20 22 55" fill="none" stroke="#795b38" stroke-width="5"/>
<!-- seagrass -->
<g fill="none" stroke="#378e65" stroke-width="6" stroke-linecap="round"><path d="M860 750q-20-65 0-102m0 102q12-70 42-94m-42 94q-42-50-53-88m160 88q-8-65 18-101m-18 101q28-56 59-70m-59 70q-37-44-40-74m120 74q6-56 34-84m-34 84q31-45 57-50"/></g>
<text x="846" y="817" class="en">Seagrass meadow</text><text x="846" y="842" class="si">මුහුදු තෘණ තණබිම</text>
<!-- mudflat, salt marsh plants -->
<path d="M1085 650Q1172 635 1296 660L1297 760 1085 760z" fill="#c9b17e" opacity=".9"/>
<g stroke="#4b8b56" stroke-width="5" fill="none"><path d="M1110 668v-40m0 24-12-14m12 7 14-16m30 45v-47m0 29-14-18m14 7 16-17m31 42v-39m0 22-11-13m11 7 14-16"/></g>
<text x="1080" y="714" class="en">Mudflat &amp; salt marsh</text><text x="1080" y="739" class="si">මඩ තැනිතලා හා ලවණ වගුරු</text>
<!-- fish -->
<g fill="#f3d17a" stroke="#735d37" stroke-width="3"><ellipse cx="760" cy="624" rx="33" ry="16"/><path d="M730 624l-20-15v30z"/><circle cx="774" cy="620" r="2.8" fill="#173f3b"/><ellipse cx="940" cy="676" rx="28" ry="14"/><path d="M914 676l-18-14v28z"/><circle cx="951" cy="672" r="2.5" fill="#173f3b"/></g>
<text x="730" y="590" class="small" fill="#fff">Fish · මසුන්</text>
<!-- bird silhouettes -->
<g fill="none" stroke="#244e48" stroke-width="5" stroke-linecap="round"><path d="M1048 404q22-25 43 0 21-25 44 0m50-24q18-20 36 0 18-20 36 0"/></g>
<text x="1080" y="350" class="en">Waterbirds</text><text x="1080" y="376" class="si">ජලජ පක්ෂීන්</text>
<!-- sun/wind/wave/flow force arrows -->
<path d="M408 432C430 490 446 530 482 580" class="flow"/>
<path d="M772 470C798 507 833 526 872 553" class="force"/>
<path d="M1440 515C1410 537 1397 555 1383 572" class="force"/>
<path d="M315 649C360 646 406 631 455 622" class="flow"/>
<!-- food web dotted arrows -->
<path d="M760 697Q812 714 859 721" class="eco"/>
<path d="M908 709Q932 694 948 689" class="eco"/>
<path d="M971 654Q1030 616 1066 504" class="eco"/>
<!-- labels for processes top of water -->
<rect x="720" y="493" width="350" height="62" rx="16" fill="#ffffffdf"/>
<text x="742" y="519" class="small">Fresh water + nutrients + sediment</text><text x="742" y="542" class="small si">මිරිදිය + පෝෂක ද්‍රව්‍ය + අවසාදිත</text>
<rect x="1145" y="490" width="242" height="62" rx="16" fill="#ffffffdf"/>
<text x="1164" y="516" class="small">Sea–lagoon exchange</text><text x="1164" y="539" class="small si">මුහුද–කලපු හුවමාරුව</text>
<!-- interaction cards -->
<rect x="55" y="930" width="470" height="190" rx="22" class="call"/>
<circle cx="100" cy="978" r="20" fill="#7eb8c6"/><path d="M96 966q-12 14 0 19 12-5 0-19" fill="#fff"/>
<text x="136" y="978" class="en">Water, salinity &amp; habitats</text><text x="78" y="1022" class="si">ජලය, ලවණතාව සහ වාසස්ථාන</text>
<text x="78" y="1060" class="small">Rain and rivers add fresh water. Tides bring seawater;</text><text x="78" y="1086" class="small">evaporation can raise salinity. This shapes where species live.</text>
<text x="78" y="1112" class="mini si">වර්ෂාවෙන් මිරිදිය එක්වේ; වඩදියෙන් මුහුදු ජලය ඇතුළුවේ.</text>
<rect x="565" y="930" width="470" height="190" rx="22" class="call"/>
<circle cx="610" cy="978" r="20" fill="#8cbd83"/><path d="M600 980q10-22 20 0m-10-18v32" stroke="#fff" stroke-width="3" fill="none"/>
<text x="646" y="978" class="en">Habitats support a food web</text><text x="588" y="1022" class="si">වාසස්ථාන ආහාර ජාලයට සහාය වේ</text>
<text x="588" y="1060" class="small">Plankton → small animals → fish → birds and people.</text>
<text x="588" y="1086" class="small">Mangrove roots shelter young fish; seagrass beds shelter</text><text x="588" y="1112" class="small">invertebrates and help hold sediment.</text>
<rect x="1075" y="930" width="470" height="190" rx="22" class="call"/>
<circle cx="1120" cy="978" r="20" fill="#dc9367"/><path d="M1110 980h20m-16-8 16 16m0-16-16 16" stroke="#fff" stroke-width="3"/>
<text x="1156" y="978" class="en">People can help or harm</text><text x="1098" y="1022" class="si">මිනිස් ක්‍රියාකාරකම්වල හොඳ හා නරක බලපෑම්</text>
<text x="1098" y="1060" class="small">Pollution, filling and blocked inlets disrupt the system.</text>
<text x="1098" y="1086" class="small">Protect water flow, reduce waste and conserve native</text><text x="1098" y="1112" class="small">mangroves and other connected habitats.</text>
<!-- legend -->
<g transform="translate(610 875)"><path d="M0 0h70" class="flow"/><text x="90" y="7" class="mini">Water / nutrient movement · ජල/පෝෂක ගමනාගමනය</text><path d="M490 0h70" class="force"/><text x="580" y="7" class="mini">Physical forces · භෞතික බලවේග</text></g>
<text x="62" y="1155" class="mini" fill="#607a73">Simplified educational diagram · Lagoon conditions differ by site and season.</text>
<text x="62" y="1177" class="mini si" fill="#607a73">සරල අධ්‍යාපනික රූප සටහනකි · ස්ථානය හා ඍතුව අනුව කලපු තත්ත්ව වෙනස් වේ.</text>
</svg>
