<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Lagoon ecosystem forces and interactions / කලපු පරිසර පද්ධතියේ බලපෑම් හා අන්තර්ක්‍රියා</title>
<desc id="desc">Bilingual educational diagram showing rainfall, catchment runoff, monsoon winds, waves, lunar tides, lagoon habitats, food webs, and human impacts.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d5eee8"/><stop offset="1" stop-color="#f8f3df"/></linearGradient>
 <linearGradient id="water" x2="0" y2="1"><stop stop-color="#5fc4bb"/><stop offset="1" stop-color="#187a83"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#56b6b5"/><stop offset="1" stop-color="#126777"/></linearGradient>
 <pattern id="sand" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#e9c98e"/><circle cx="3" cy="5" r="1" fill="#c19a5e"/><circle cx="13" cy="12" r="1" fill="#c19a5e"/></pattern>
 <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#3287a1"/></marker>
 <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#d18b45"/></marker>
 <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#38835e"/></marker>
 <style>
  text{font-family:'Noto Sans Sinhala','Iskoola Pota','Arial',sans-serif;fill:#173f3b}.en{font-size:22px;font-weight:700}.si{font-size:20px;font-weight:600;fill:#44645d}.small{font-size:17px}.mini{font-size:15px}.title{font:700 44px Georgia,serif;letter-spacing:-.5px}.subtitle{font-size:22px;fill:#56746d}.call{fill:#fffdf7;stroke:#d8e5db;stroke-width:2}.flow{fill:none;stroke:#3287a1;stroke-width:5;stroke-linecap:round;marker-end:url(#arrowBlue)}.force{fill:none;stroke:#d18b45;stroke-width:5;stroke-linecap:round;marker-end:url(#arrowGold)}.eco{fill:none;stroke:#38835e;stroke-width:4;stroke-dasharray:9 8;stroke-linecap:round;marker-end:url(#arrowGreen)}
 </style>
</defs>
<rect width="1600" height="1180" rx="28" fill="#f8f4e8"/>
<rect x="0" y="0" width="1600" height="260" rx="28" fill="url(#sky)"/>
<text x="62" y="66" class="title">A lagoon is shaped by many connected forces</text>
<text x="64" y="108" class="subtitle">කලපුවක් බොහෝ අන්තර්සම්බන්ධිත බලපෑම්වලින් හැඩගැසේ</text>
<text x="64" y="153" class="small" fill="#638079">Rain · rivers · tides · waves · habitats · wildlife · people</text>
<text x="64" y="182" class="small" fill="#638079">වර්ෂාව · ගංගා · වඩදිය-බාදිය · රළ · වාසස්ථාන · වනජීවීන් · මිනිසුන්</text>
<!-- moon cycle card -->
<rect x="1030" y="30" width="510" height="205" rx="22" fill="#fffdf7" stroke="#d5e4dd" stroke-width="2"/>
<text x="1060" y="68" class="en">Lunar cycle and tides</text><text x="1060" y="98" class="si">චන්ද්‍ර චක්‍රය සහ වඩදිය-බාදිය</text>
<g transform="translate(1090 139)"><circle r="20" fill="#efc86d"/><path d="M0-20 A20 20 0 0 0 0 20 A15 20 0 0 1 0-20" fill="#fffdf7"/><text x="-42" y="50" class="mini">New / අමාවක</text></g>
<g transform="translate(1230 139)"><circle r="20" fill="#efc86d"/><path d="M0-20 A20 20 0 0 0 0 20 A14 20 0 0 1 0-20" fill="#fffdf7"/><text x="-45" y="50" class="mini">Quarter / අඩ සඳ</text></g>
<g transform="translate(1370 139)"><circle r="20" fill="#efc86d"/><text x="-45" y="50" class="mini">Full / පසළොස්වක</text></g>
<text x="1060" y="215" class="mini">New/full: usually stronger spring tides · අමාවක/පසළොස්වක: සාමාන්‍යයෙන් වැඩි වඩදිය පරාසය</text>
<!-- landscape background -->
<path d="M0 290 Q120 245 250 290 Q340 330 455 385 L455 700 L0 700z" fill="#9acb9b"/>
<path d="M0 450 Q180 455 355 500 Q450 528 500 563 L500 742 L0 742z" fill="#63a979"/>
